name: nanochat
version: 0.1.0.0
synopsis: A transformer language model implemented with Hasktorch

dependencies:
  - base >= 4.14 && < 5
  - hasktorch

library:
  source-dirs: src
  exposed-modules:
    - NanoChat
  ghc-options:
    - -Wall

executables:
  nanochat:
    main: nano.hs
    source-dirs: app
    dependencies:
      - nanochat
      - text
    default-extensions:
      - OverloadedStrings
    ghc-options:
      - -Wall
