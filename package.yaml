name: nanochat
version: 0.1.0.0
synopsis: A transformer language model implemented with Hasktorch

dependencies:
  - base >= 4.14 && < 5
  - hasktorch >= 0.2.2 && < 0.2.3

library:
  source-dirs: src
  exposed-modules:
    - NanoChat
    - NanoChat.Tokenizer
    - NanoChat.Training
    - NanoChat.Checkpoint
  dependencies:
    - aeson
    - bytestring
    - containers
    - directory
    - filepath
    - text
  ghc-options:
    - -Wall

executables:
  nanochat-train:
    main: Main.hs
    source-dirs: app/train
    dependencies:
      - nanochat
      - text
      - directory
      - filepath
    ghc-options:
      - -Wall
  nanochat:
    main: Main.hs
    source-dirs: app/chat
    dependencies:
      - nanochat
      - text
    default-extensions:
      - OverloadedStrings
    ghc-options:
      - -Wall

tests:
  nanochat-test:
    main: Main.hs
    source-dirs: test
    dependencies:
      - nanochat
      - text
      - directory
    ghc-options:
      - -Wall
